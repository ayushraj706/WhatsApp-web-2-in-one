name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            APP_DIR=/home/${{ secrets.EC2_USER }}/whatsapp-saas-clone

            if [ ! -d "$APP_DIR" ]; then
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            # 🔥 SMART FIX 1: Cloudflare 521 Error Auto-Fix
            # Yeh frontend ko hamesha Port 80 par set rakhega taaki Cloudflare block na kare
            sed -i 's/3000:3000/80:3000/g' docker-compose.yml || true

            # 🔥 SMART FIX 2: Database SSL Crash Auto-Fix
            # Agar URL mein sslmode nahi hai, toh yeh khud laga dega
            DB_URL="${{ secrets.DATABASE_URL }}"
            if [[ "$DB_URL" != *"sslmode=disable"* ]]; then
              DB_URL="${DB_URL}?sslmode=disable"
            fi

            # Backend .env file creation (Using GitHub Secrets securely)
            cat > backend/.env << ENVEOF
            NODE_ENV=production
            PORT=5000
            DATABASE_URL=$DB_URL
            REDIS_URL=${{ secrets.REDIS_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            FCM_PROJECT_ID=${{ secrets.FCM_PROJECT_ID }}
            FCM_CLIENT_EMAIL=${{ secrets.FCM_CLIENT_EMAIL }}
            FCM_PRIVATE_KEY=${{ secrets.FCM_PRIVATE_KEY }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            ENVEOF

            # Frontend .env.local file creation (Using GitHub Secrets securely)
            cat > frontend/.env.local << ENVEOF
            NEXT_PUBLIC_API_URL=${{ secrets.FRONTEND_URL }}:5000
            NEXT_PUBLIC_FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            GITHUB_ID=${{ secrets.GITHUB_ID }}
            GITHUB_SECRET=${{ secrets.GITHUB_SECRET }}
            ENVEOF

            # .dockerignore se .env hatana
            sed -i '/\.env/d' frontend/.dockerignore || true
            sed -i '/\.env/d' backend/.dockerignore || true

            # 🔥 SMART FIX 3: Backend Database Tables (Prisma) Auto-Push
            # Pehle database container start karo, aur fresh tables banao
            docker compose up -d postgres redis
            sleep 5
            docker compose run --rm backend npx prisma@5 db push

            # Build & restart saare containers fresh state mein
            docker compose down
            docker compose up -d --build

            # Puraani files clean karke AWS ki storage bachana
            docker image prune -f

      - name: Health check
        run: |
          sleep 10
          curl -f ${{ secrets.FRONTEND_URL }} || echo "Health check failed — inspect EC2 logs"
