name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            APP_DIR=/home/${{ secrets.EC2_USER }}/whatsapp-saas-clone

            if [ ! -d "$APP_DIR" ]; then
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            # Write secrets to backend .env file
            cat > backend/.env << 'ENVEOF'
            NODE_ENV=production
            PORT=5000
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            FCM_PROJECT_ID=${{ secrets.FCM_PROJECT_ID }}
            FCM_CLIENT_EMAIL=${{ secrets.FCM_CLIENT_EMAIL }}
            FCM_PRIVATE_KEY=${{ secrets.FCM_PRIVATE_KEY }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            ENVEOF

            # Write secrets to frontend .env.local file (NextAuth aur GitHub keys added)
            cat > frontend/.env.local << 'ENVEOF'
            NEXT_PUBLIC_API_URL=${{ secrets.FRONTEND_URL }}:5000
            NEXT_PUBLIC_FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            NEXTAUTH_URL=${{ secrets.FRONTEND_URL }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            GITHUB_ID=${{ secrets.GITHUB_ID }}
            GITHUB_SECRET=${{ secrets.GITHUB_SECRET }}
            ENVEOF

            # NAYA STEP: .dockerignore se .env ko hatana taaki Docker in files ko padh sake
            sed -i '/\.env/d' frontend/.dockerignore || true
            sed -i '/\.env/d' backend/.dockerignore || true

            # Build & restart containers (Bina Prisma push ke taaki crash na ho)
            docker compose down
            docker compose up -d --build

            # Prune old images to save EC2 disk space
            docker image prune -f

      - name: Health check
        run: |
          sleep 10
          curl -f ${{ secrets.FRONTEND_URL }}/health || echo "Health check failed — inspect EC2 logs"
